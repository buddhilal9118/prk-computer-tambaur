name: Fix owner profile image
on:
  push:
    branches: [main]
    paths:
      - 'assets/owner-profile.png'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user Pillow
      - name: Convert high-resolution PNG to JPG
        run: |
          python3 - <<'PY'
          from PIL import Image
          src='assets/owner-profile.png'
          dst='assets/owner-profile.jpg'
          im=Image.open(src).convert('RGBA')
          bg=Image.new('RGB', im.size, 'white')
          bg.paste(im, mask=im.getchannel('A'))
          bg.save(dst, 'JPEG', quality=96, optimize=True)
          PY
      - name: Commit image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/owner-profile.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Fix owner profile image'
          git push
