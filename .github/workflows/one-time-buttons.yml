name: one-time add buttons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add permanent buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="actions"><a class="action primary" href="#application">📝 ग्राहक आवेदन करें</a><a class="action" href="#owner">👤 Center Owner</a></div>'''
          new=old+'<div class="quick-tools" style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><a href="status.html" style="background:linear-gradient(135deg,#0b7bdb,#0752bd);color:#fff;padding:12px 18px;border-radius:12px;font-weight:900">🔎 काम का Status Check करें</a><a href="admin.html" style="background:linear-gradient(135deg,#061b43,#173b78);color:#fff;padding:12px 18px;border-radius:12px;font-weight:900">🔐 Admin Login / Work Upload</a></div>'
          if 'href="status.html"' not in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add permanent customer status and admin buttons'
          git push
          rm -f .github/workflows/one-time-buttons.yml
          git add .github/workflows/one-time-buttons.yml
          git commit -m 'Remove one-time button patch workflow'
          git push
